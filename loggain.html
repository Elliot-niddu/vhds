<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="loginruta">
 <form id="myForm">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username">
        <div class="passtext">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        </div>
        <br><div class="knapp"><input type="submit" value="Submit"></div><br>
    </form>
</section>
    <script>
        let username = null;
        const form = document.getElementById('myForm');

        form.addEventListener('submit', function (event){
            event.preventDefault(); 
            
            
            const text = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
           
            console.log(text + password);
            
            
            
            if(text == "elliot" && password == "1234"){
                username = text;
                
                window.location.href = `scooter.html?username=${encodeURIComponent(username)}`;
            }
            else{
                alert("Fel användarnamn eller lösenord!");
            }
        });
    </script>



    </body>
</html>
