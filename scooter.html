<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hemsida</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<div class="titel">
    <h1>Välkommen</h1>
</div>

<img class= elscooter src="elscooter_rull_Nitrox_H10_2.avif" alt="elscooter">

<div class="hyrknapp">
<br>
<button id="hyrknapp">Hyra elscooter</button>
<br>
<p id="status" class="intehyrd">Ingen elscooter hyrd.</p>
    </div>
    
       <script>
    const hyrknapp = document.getElementById("hyrknapp");
    const statusText = document.getElementById("status");

    let hyrd = false;

    hyrknapp.onclick = function () {
        if (!hyrd) {
            statusText.textContent = "Elscooter är hyrd.";
            statusText.className = "hyrd";
            hyrknapp.textContent = "Lämna tillbaka elscooter";
            hyrd = true;
        } else {
            statusText.textContent = "Ingen elscooter är hyrd.";
            statusText.className = "inte hyrd ";
            hyrknapp.textContent = "Hyr elscooter";
            hyrd = false;
        }
    };
</script>

    </body>
</html>
